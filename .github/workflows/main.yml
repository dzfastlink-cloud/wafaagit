name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch hls.js (pinned) for offline playback
        run: |
          mkdir -p app/src/main/assets/js/lib
          curl -fsSL https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js -o /tmp/hls.min.js \
            && grep -q "Hls" /tmp/hls.min.js \
            && cp /tmp/hls.min.js app/src/main/assets/js/lib/hls.min.js \
            && echo "hls.js bundled" \
            || echo "::warning::hls.js not bundled; the app will load it from the CDN at runtime"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: List built APKs
        run: ls -la app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WasslaTV-apk
          path: app/build/outputs/apk/release/*.apk
